<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoVigil</title>
<style>
:root{--bg:#eef0f3;--card:#fcfcfb;--ink:#151a22;--muted:#586173;--line:#d3d8e0;--accent:#1f3fbf;--soft:#e3e8fb;--review:#ec835a;--ok:#2f7d57;--risk:#b4541f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;position:sticky;top:0;z-index:2}
header b{font-size:18px}
.notice{font-size:13px;color:var(--muted);flex:1;min-width:220px}
.badge{font:12px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:5px;padding:2px 8px}
.badge.fx{border-color:var(--risk);color:var(--risk)}.badge.md{border-color:var(--ok);color:var(--ok)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:6px 12px;font:inherit;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
button.act{font:inherit;font-size:13px;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);cursor:pointer}
button.act:hover{border-color:var(--accent);color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:18px 20px;max-width:1280px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:1fr}}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
h2{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h3{margin:8px 0 0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pt{font:500 24px/1.15 Georgia,serif}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.src{font:11px ui-monospace,Menlo,monospace;color:var(--accent);border:1px solid var(--line);border-radius:4px;padding:1px 5px;white-space:nowrap;margin-left:4px;text-decoration:none;display:inline-block}
a.src:hover{border-color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}
td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.st{font:11px ui-monospace,Menlo,monospace;border-radius:4px;padding:1px 6px;border:1px solid var(--line);white-space:nowrap}
.st.probably_not_taking,.st.unclear{border-color:var(--risk);color:var(--risk)}
.flag{border:1px solid var(--line);border-left:4px solid var(--review);border-radius:7px;padding:12px;display:flex;flex-direction:column;gap:7px}
.flag.accept{border-left-color:var(--ok)}.flag.dismiss{border-left-color:var(--line);opacity:.6}
.when{font:11px ui-monospace,Menlo,monospace;color:var(--muted)}
.stamp{font:12px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:5px;padding:3px 8px;align-self:flex-start}
.stamp.verified{border-color:var(--ok);color:var(--ok)}.stamp.unresolved,.stamp.none{border-color:var(--risk);color:var(--risk)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=text],textarea{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--card);color:var(--ink);flex:1;min-width:180px}
.logline{font-size:13px;color:var(--muted)}
.err{color:var(--risk);font-size:13px}
#log li{font:12px ui-monospace,Menlo,monospace;color:var(--muted)}
.wide{grid-column:1/-1}
</style>
</head>
<body>
<header>
  <b>CoVigil</b>
  <span class="notice" id="notice"></span>
  <span class="badge" id="origin"></span>
  <label class="row" style="font-size:13px"><input type="checkbox" id="hasPharm" checked> Clinic has a pharmacist</label>
  <div class="seg" role="group" aria-label="Viewing as">
    <button type="button" id="rolePharm" aria-pressed="false">Pharmacist</button>
    <button type="button" id="rolePhys" aria-pressed="true">Physician</button>
  </div>
  <button class="act" type="button" id="gen">Run on the records</button>
  <button class="act" type="button" id="aud">Check against sources</button>
  <button class="act" type="button" id="reset">Reset reviews</button>
  <span class="err" id="err"></span>
</header>
<main>
  <section>
    <h2>The brief</h2>
    <div class="pt" id="pt"></div>
    <ul id="story"></ul>
    <h3>What he is actually taking</h3>
    <table><tbody id="meds"></tbody></table>
    <h3>Allergies</h3><div id="allergy"></div>
    <h3>Already done, no need to repeat</h3><ul id="tests"></ul>
    <h3>Asked for by other clinicians</h3><ul id="open"></ul>
    <h3>Looked for and not found</h3><ul id="nf"></ul>
  </section>
  <section>
    <h2 id="flagsTitle">Medication issues to review</h2>
    <div id="flags" style="display:flex;flex-direction:column;gap:10px"></div>
  </section>
  <section class="wide" id="auditBox" hidden>
    <h2>Checked against sources by a second pass</h2>
    <div id="audit"></div>
  </section>
  <section class="wide">
    <h2>Decision log</h2>
    <ul id="log"></ul>
  </section>
</main>
<script>
var S={brief:null,state:null,audit:null,role:"physician",hasPharm:true};
function $(id){return document.getElementById(id);}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function chip(s){var m=/^fax p\.?\s*(\d+)/i.exec(s),e;
  if(m){e=el("a","src",s);e.href="/data/outside_records_fax.pdf#page="+m[1];e.target="_blank";e.rel="noopener";e.title="Open this page of the fax";}
  else e=el("span","src",s);return e;}
function withSrc(parent,text,sources){parent.appendChild(document.createTextNode(text+" "));(sources||[]).forEach(function(s){parent.appendChild(chip(s));});return parent;}
function list(id,items,fmt){var ul=$(id);ul.textContent="";(items||[]).forEach(function(it){var li=el("li");fmt(li,it);ul.appendChild(li);});if(!(items||[]).length)ul.appendChild(el("li","logline","None listed."));}
function when(t){try{return new Date(t).toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});}catch(e){return t;}}
async function api(path,body){
  $("err").textContent="";
  var r=await fetch(path,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:undefined);
  var j=await r.json().catch(function(){return {};});
  if(!r.ok){$("err").textContent=j.detail||("Request failed ("+r.status+")");throw new Error(j.detail);}
  return j;
}
async function load(){var j=await api("/api/brief");S.brief=j.brief;S.state=j.state;S.audit=j.audit;render();}
function render(){
  var b=S.brief,st=S.state;
  $("notice").textContent=b.notice||"Software-generated draft for clinician review. Not a diagnosis.";
  $("origin").textContent=b.origin==="model"?"generated by "+(b.generated_by||"model"):"hand-written sample, not model output";
  $("origin").className="badge "+(b.origin==="model"?"md":"fx");
  var p=b.patient||{};$("pt").textContent=[p.name,p.age].filter(Boolean).join(", ")+(p.reason_for_visit?". "+p.reason_for_visit:"");
  list("story",b.story,function(li,it){withSrc(li,it.text,it.sources);});
  var tb=$("meds");tb.textContent="";
  (b.medications_actually_taking||[]).forEach(function(m){var tr=el("tr");
    tr.appendChild(el("td",null,(m.drug||"")+(m.dose?" "+m.dose:"")));
    var s=el("td");s.appendChild(el("span","st "+(m.status||""),String(m.status||"").replace(/_/g," ")));tr.appendChild(s);
    tr.appendChild(withSrc(el("td"),m.evidence||"",m.sources));tb.appendChild(tr);});
  var a=$("allergy");a.textContent="";if(b.allergies)withSrc(a,b.allergies.text||"",b.allergies.sources);
  list("tests",b.tests_already_done,function(li,it){withSrc(li,[it.test,it.date,it.result].filter(Boolean).join(" · "),it.sources);});
  list("open",b.open_items_from_other_clinicians,function(li,it){withSrc(li,it.text,it.sources);});
  list("nf",(b.not_found||[]).map(function(t){return {text:t};}),function(li,it){li.textContent=it.text;});
  renderFlags();renderAudit();
  var lg=$("log");lg.textContent="";
  (st.log||[]).slice().reverse().forEach(function(e){
    var txt=e.type==="decision"?(e.flag_id+" · "+(e.action==="accept"?"accepted":"dismissed")+" by "+e.by+(e.reason?" · "+e.reason:"")):(e.flag_id+" · marked "+e.status+" by "+e.by+(e.note?" · "+e.note:""));
    lg.appendChild(el("li",null,when(e.at)+" · "+txt));});
  if(!(st.log||[]).length)lg.appendChild(el("li",null,"No decisions yet."));
  $("rolePharm").setAttribute("aria-pressed",S.role==="pharmacist");$("rolePhys").setAttribute("aria-pressed",S.role==="physician");
  $("rolePharm").disabled=!S.hasPharm;
}
function renderFlags(){
  var box=$("flags"),b=S.brief,st=S.state;box.textContent="";
  var issues=b.medication_issues||[];
  $("flagsTitle").textContent="Medication issues to review ("+issues.length+")";
  issues.forEach(function(f){
    var d=st.decisions[f.id],v=st.verifications[f.id];
    var card=el("div","flag"+(d?" "+d.action:""));
    card.appendChild(el("span","when",f.when==="before_visit"?"SORT OUT BEFORE THE VISIT":"DISCUSS AT THE VISIT"));
    card.appendChild(el("b",null,f.title));
    card.appendChild(el("span",null,f.why_review));
    var sr=el("div");(f.sources||[]).forEach(function(s){var c=chip(s);c.style.marginLeft="0";c.style.marginRight="5px";sr.appendChild(c);});card.appendChild(sr);
    var stamp;
    if(!S.hasPharm)stamp=el("span","stamp none","unverified · no pharmacist at this clinic");
    else if(v)stamp=el("span","stamp "+v.status,(v.status==="verified"?"verified by ":"unresolved · checked by ")+v.by+" · "+when(v.at));
    else stamp=el("span","stamp","draft · not yet verified");
    card.appendChild(stamp);
    if(S.hasPharm&&v&&v.note)card.appendChild(el("span","logline","Pharmacist note: "+v.note));
    if(S.role==="pharmacist"&&S.hasPharm){
      var row=el("div","row"),ta=el("textarea");ta.rows=2;ta.id="note-"+f.id;ta.placeholder="What you checked and found";ta.value=v?v.note:"";
      var ok=el("button","act","Mark verified"),un=el("button","act","Mark unresolved");ok.type=un.type="button";
      ok.onclick=function(){verify(f.id,"verified",ta.value);};un.onclick=function(){verify(f.id,"unresolved",ta.value);};
      row.appendChild(ta);row.appendChild(ok);row.appendChild(un);card.appendChild(row);
    }else if(S.role==="physician"){
      if(d){card.appendChild(el("span","logline",(d.action==="accept"?"Accepted":"Dismissed")+" by "+d.by+", "+when(d.at)+(d.reason?": "+d.reason:"")));}
      var r2=el("div","row"),inp=el("input");inp.type="text";inp.id="reason-"+f.id;inp.placeholder="Reason (needed to dismiss)";
      var ac=el("button","act",d?"Change to accept":"Accept"),di=el("button","act",d?"Change to dismiss":"Dismiss");ac.type=di.type="button";
      ac.onclick=function(){decide(f.id,"accept",inp.value);};di.onclick=function(){decide(f.id,"dismiss",inp.value);};
      r2.appendChild(inp);r2.appendChild(ac);r2.appendChild(di);card.appendChild(r2);
    }
    box.appendChild(card);
  });
  if(!issues.length)box.appendChild(el("span","logline","No medication issues raised."));
}
function renderAudit(){
  var a=S.audit;$("auditBox").hidden=!a;if(!a)return;var box=$("audit");box.textContent="";
  var u=a.unsupported||[],m=a.missing||[];
  box.appendChild(el("p",null,u.length+" statement"+(u.length===1?"":"s")+" not supported by the cited source. "+m.length+" fact"+(m.length===1?"":"s")+" the brief left out."));
  var ul=el("ul");u.forEach(function(x){ul.appendChild(el("li",null,"Not supported: "+x.text+(x.problem?" ("+x.problem+")":"")));});
  m.forEach(function(x){withSrc(ul.appendChild(el("li")),"Left out: "+x.text,x.sources);});box.appendChild(ul);
}
async function verify(id,status,note){try{S.state=await api("/api/verify",{flag_id:id,status:status,note:note,by:"Pharmacist"});render();}catch(e){}}
async function decide(id,action,reason){try{S.state=await api("/api/decision",{flag_id:id,action:action,reason:reason,by:"Clara"});render();}catch(e){}}
$("rolePharm").onclick=function(){S.role="pharmacist";render();};
$("rolePhys").onclick=function(){S.role="physician";render();};
$("hasPharm").onchange=function(e){S.hasPharm=e.target.checked;if(!S.hasPharm)S.role="physician";render();};
$("reset").onclick=async function(){S.state=await api("/api/reset",{});render();};
$("gen").onclick=async function(){var b=$("gen");b.disabled=true;b.textContent="Reading the records…";
  try{await api("/api/generate",{});await load();}catch(e){}finally{b.disabled=false;b.textContent="Run on the records";}};
$("aud").onclick=async function(){var b=$("aud");b.disabled=true;b.textContent="Checking…";
  try{var j=await api("/api/audit",{});S.audit=j.audit;render();}catch(e){}finally{b.disabled=false;b.textContent="Check against sources";}};
load();
</script>
</body>
</html>
